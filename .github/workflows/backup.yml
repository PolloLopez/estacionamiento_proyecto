name: Backup PostgreSQL diario

# Corre todos los días a las 03:00 UTC (00:00 Argentina en horario de verano).
# También se puede disparar manualmente desde GitHub → Actions → "Run workflow".
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest

    steps:
      - name: Generar nombre del archivo con fecha
        id: nombre
        run: |
          FECHA=$(date -u +"%Y-%m-%d_%H-%M")
          echo "archivo=backup_${FECHA}.sql.gz" >> $GITHUB_OUTPUT

      - name: Ejecutar pg_dump y comprimir
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          # set -o pipefail: falla si pg_dump falla, aunque gzip no falle.
          # Sin esto, un pg_dump fallido sube un archivo vacío silenciosamente.
          set -o pipefail

          # Usamos la imagen Docker oficial de postgres:18 en lugar de instalar
          # el cliente vía apt. Motivo: Ubuntu trae postgresql-client-16 por defecto
          # y Railway corre PostgreSQL 18 — pg_dump rechaza la conexión si el cliente
          # es más viejo que el servidor.
          # Docker está siempre disponible en los runners de GitHub Actions.
          docker run --rm \
            -e DATABASE_URL \
            postgres:18 \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-acl --format=plain' \
            | gzip > ${{ steps.nombre.outputs.archivo }}

          echo "Tamaño del backup: $(du -sh ${{ steps.nombre.outputs.archivo }} | cut -f1)"

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nombre.outputs.archivo }}
          path: ${{ steps.nombre.outputs.archivo }}
          # 30 días de retención: cubre un mes completo de backups diarios.
          retention-days: 30
