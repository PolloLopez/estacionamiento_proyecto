name: Backup PostgreSQL diario

# Corre todos los días a las 03:00 UTC (00:00 Argentina en horario de verano).
# También se puede disparar manualmente desde GitHub → Actions → "Run workflow".
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump → artifact
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente PostgreSQL 18
        run: |
          # Ubuntu trae postgresql-client 16 por defecto.
          # Railway usa PostgreSQL 18, y pg_dump falla si el cliente es más viejo que el server.
          # Agregamos el repositorio oficial de PostgreSQL para instalar la versión correcta.
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18

      - name: Generar nombre del archivo con fecha
        id: nombre
        run: |
          FECHA=$(date -u +"%Y-%m-%d_%H-%M")
          echo "archivo=backup_${FECHA}.sql.gz" >> $GITHUB_OUTPUT

      - name: Ejecutar pg_dump y comprimir
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          # set -o pipefail: hace que el paso falle si pg_dump falla, aunque gzip
          # no falle. Sin esto, un pg_dump fallido sube un archivo vacío silenciosamente.
          set -o pipefail

          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            | gzip > ${{ steps.nombre.outputs.archivo }}

          # Mostrar tamaño del backup para tener registro en el log
          echo "Tamaño del backup: $(du -sh ${{ steps.nombre.outputs.archivo }} | cut -f1)"

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nombre.outputs.archivo }}
          path: ${{ steps.nombre.outputs.archivo }}
          # 30 días de retención: cubre un mes completo de backups diarios.
          # Si querés más historial, subilo hasta 90 (el máximo de GitHub Actions).
          retention-days: 30
