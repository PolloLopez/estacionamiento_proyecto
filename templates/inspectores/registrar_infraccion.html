{% extends "base.html" %}
{% block title %}Registrar Infracción{% endblock %}
{% block content %}

<div class="inf-wrap">

  <div class="inf-header">
    <h2>🚨 Registrar infracción</h2>
    <a href="{% url 'panel_inspectores' %}" class="btn btn-outline" style="font-size:0.88rem;">
      ← Inicio
    </a>
  </div>

  {% if mensaje %}
  <div style="background:#f8d7da; color:#721c24; border:1px solid #f5c6cb;
              padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem; font-weight:600;">
    {{ mensaje }}
  </div>
  {% endif %}

  <form id="infraccionForm" method="post"
        action="{% url 'inspectores_registrar_infraccion' %}?patente={{ patente }}"
        enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Patente (solo lectura, visible grande) -->
    <div class="inf-patente">{{ patente }}</div>
    <input type="hidden" name="patente" value="{{ patente }}" />

    <!-- Subcuadra: cascade Calle → Altura -->
    <div class="inf-field">
      <label>📍 Ubicación</label>
      <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
        <select id="sel-calle" class="inf-field select"
                style="flex:1; min-width:110px; padding:0.6rem 0.75rem;
                       border:1.5px solid var(--color-border); border-radius:8px;
                       font-size:0.97rem; background:var(--color-surface); color:var(--color-text);">
          <option value="">— Calle —</option>
        </select>
        <select id="sel-altura" class="inf-field select"
                style="flex:1; min-width:80px; padding:0.6rem 0.75rem;
                       border:1.5px solid var(--color-border); border-radius:8px;
                       font-size:0.97rem; background:var(--color-surface); color:var(--color-text);"
                disabled>
          <option value="">— Altura —</option>
        </select>
      </div>
      <input type="hidden" name="subcuadra_id" id="hidden-subcuadra" required>
    </div>

    <!-- Foto -->
    <div class="inf-field">
      <label>📸 FOTO</label>
      <input type="file" id="foto" name="foto"
             accept="image/*" capture="environment" required />
    </div>

    <!-- GPS: coordenadas visibles -->
    <div style="margin-bottom:1rem;">
      <span id="gps_chip" class="gps-chip esperando">
        <span id="gps_icono">⏳</span>
        <span id="gps_texto">Obteniendo ubicación...</span>
      </span>
    </div>

    <!-- Campos ocultos GPS -->
    <input type="hidden" id="gps_lat" name="gps_lat" value="" />
    <input type="hidden" id="gps_lon" name="gps_lon" value="" />
    <input type="hidden" id="gps_acc" name="gps_acc" value="" />

    <button type="submit" id="btnGrabar" class="btn btn-danger btn-grabar" disabled>
      🚨 Grabar acta de infracción
    </button>

  </form>

</div>

<script>
(function () {
  var btn     = document.getElementById("btnGrabar");
  var chip    = document.getElementById("gps_chip");
  var icono   = document.getElementById("gps_icono");
  var texto   = document.getElementById("gps_texto");
  var latEl   = document.getElementById("gps_lat");
  var lonEl   = document.getElementById("gps_lon");
  var accEl   = document.getElementById("gps_acc");

  function habilitar() { btn.disabled = false; }

  if (!navigator.geolocation) {
    chip.className = "gps-chip error";
    icono.textContent = "⚠️";
    texto.textContent = "GPS no disponible";
    habilitar();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function (pos) {
      var lat = pos.coords.latitude.toFixed(5);
      var lon = pos.coords.longitude.toFixed(5);
      var acc = Math.round(pos.coords.accuracy);
      latEl.value = lat;
      lonEl.value = lon;
      accEl.value = acc;
      chip.className = "gps-chip";
      icono.textContent = "📍";
      texto.textContent = lat + ", " + lon + " ±" + acc + "m";
      habilitar();
    },
    function () {
      chip.className = "gps-chip error";
      icono.textContent = "⚠️";
      texto.textContent = "Sin ubicación — foto sin marca GPS";
      habilitar();
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}());

// ── Cascade Calle → Altura ────────────────────────────────────────
var SUBCUADRAS_INF = [
  {% for s in subcuadras %}{id: {{ s.id }}, calle: "{{ s.calle }}", altura: "{{ s.altura }}"},
  {% endfor %}
];

(function() {
  var selCalle  = document.getElementById("sel-calle");
  var selAltura = document.getElementById("sel-altura");
  var hidden    = document.getElementById("hidden-subcuadra");

  // Poblar calles únicas
  var callesVistas = {};
  SUBCUADRAS_INF.forEach(function(s) {
    if (!callesVistas[s.calle]) {
      callesVistas[s.calle] = true;
      var opt = document.createElement("option");
      opt.value = s.calle;
      opt.textContent = s.calle;
      selCalle.appendChild(opt);
    }
  });

  selCalle.addEventListener("change", function() {
    var calle = selCalle.value;
    selAltura.innerHTML = '<option value="">— Altura —</option>';
    hidden.value = "";
    if (!calle) { selAltura.disabled = true; return; }
    var filtradas = SUBCUADRAS_INF.filter(function(s) { return s.calle === calle; });
    filtradas.forEach(function(s) {
      var opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.altura;
      selAltura.appendChild(opt);
    });
    selAltura.disabled = false;
    if (filtradas.length === 1) { selAltura.value = filtradas[0].id; hidden.value = filtradas[0].id; }
  });

  selAltura.addEventListener("change", function() { hidden.value = selAltura.value; });

  // Preseleccionar subcuadra_default (viene de sesión del inspector)
  var defId = "{{ subcuadra_default|default:'' }}";
  if (defId) {
    var sub = SUBCUADRAS_INF.find(function(s) { return s.id == defId; });
    if (sub) {
      selCalle.value = sub.calle;
      selCalle.dispatchEvent(new Event("change"));
      selAltura.value = defId;
      hidden.value = defId;
    }
  }
})();
</script>

{% endblock %}
