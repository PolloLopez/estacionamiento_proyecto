{% extends "base.html" %}
{% block title %}Pagar — Estacionamiento{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:center;
            min-height:calc(100dvh - var(--navbar-h) - 60px); padding:1.5rem 1rem;">
  <div class="card" style="max-width:440px; width:100%; padding:2.5rem 2rem;">

    <div style="text-align:center; margin-bottom:2rem;">
      <div style="font-size:3rem; margin-bottom:0.5rem;">🅿️</div>
      <h1 style="font-size:1.5rem; font-weight:800; color:#14883b; margin-bottom:0.3rem;">
        Pago sin registro
      </h1>
      <p class="text-muted" style="font-size:0.9rem;">
        Pagá infracciones, estacioná o contratá abono mensual sin registrarte.
      </p>
    </div>

    <form method="post" action="{% url 'pago_publico_buscar' %}" id="form-buscar-patente">
      {% csrf_token %}

      <label for="id_patente" style="font-weight:700; font-size:0.9rem;">Patente del vehículo</label>
      <input type="text" id="id_patente" name="patente"
             oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); validarPatentes();"
             placeholder="ABC123 o AA123BB"
             maxlength="10" required autocomplete="off"
             style="font-size:1.8rem; text-align:center; letter-spacing:5px;
                    font-weight:700; text-transform:uppercase; margin-top:0.25rem;">

      <label for="id_patente_confirm"
             style="font-weight:700; font-size:0.9rem; margin-top:1rem; display:block;">
        Confirmá la patente
      </label>
      <input type="text" id="id_patente_confirm"
             oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); validarPatentes();"
             placeholder="Repetí la patente"
             maxlength="10" required autocomplete="off"
             style="font-size:1.8rem; text-align:center; letter-spacing:5px;
                    font-weight:700; text-transform:uppercase; margin-top:0.25rem;">

      <!-- Aviso de error visible solo cuando las patentes no coinciden -->
      <p id="aviso-patentes" style="display:none; color:var(--color-danger,#c0392b);
                                     font-size:0.85rem; font-weight:600; margin-top:0.4rem;
                                     text-align:center;">
        ⚠️ Las patentes no coinciden
      </p>

      <button type="submit" id="btn-buscar"
              class="btn" style="width:100%; margin-top:0.75rem; font-size:1rem; padding:0.8rem;">
        Buscar →
      </button>
    </form>

    <script>
    // Valida que ambos campos tengan la misma patente antes de permitir el envío.
    // Muestra un aviso y deshabilita el botón si no coinciden.
    function validarPatentes() {
      var p1  = document.getElementById("id_patente").value;
      var p2  = document.getElementById("id_patente_confirm").value;
      var btn = document.getElementById("btn-buscar");
      var aviso = document.getElementById("aviso-patentes");
      var coinciden = (p1 === p2) || p2.length === 0;
      // Mostrar aviso solo cuando el segundo campo tiene algo escrito
      aviso.style.display = (p2.length > 0 && p1 !== p2) ? "block" : "none";
      // Deshabilitar el botón si el segundo campo está completo y no coincide
      btn.disabled = (p2.length > 0 && p1 !== p2);
    }

    // Impedir el submit si no coinciden (doble seguro)
    document.getElementById("form-buscar-patente").addEventListener("submit", function(e) {
      var p1 = document.getElementById("id_patente").value;
      var p2 = document.getElementById("id_patente_confirm").value;
      if (p1 !== p2) {
        e.preventDefault();
        document.getElementById("aviso-patentes").style.display = "block";
      }
    });
    </script>

    <div style="margin-top:1.5rem; padding-top:1.5rem; border-top:1px solid var(--color-border);
                text-align:center; font-size:0.85rem; color:var(--color-text-muted);">
      ¿Tenés cuenta? <a href="{% url 'login' %}" style="color:#14883b; font-weight:600;">Ingresar</a>
    </div>
  </div>
</div>
{% endblock %}
