{% extends "base.html" %}
{% block title %}Pagar — Estacionamiento{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:center;
            min-height:calc(100dvh - var(--navbar-h) - 60px); padding:1.5rem 1rem;">
  <div class="card" style="max-width:440px; width:100%; padding:2.5rem 2rem;">

    <div style="text-align:center; margin-bottom:2rem;">
      <div style="font-size:3rem; margin-bottom:0.5rem;">🅿️</div>
      <h1 style="font-size:1.5rem; font-weight:800; color:#14883b; margin-bottom:0.3rem;">
        Pago sin registro
      </h1>
      <p class="text-muted" style="font-size:0.9rem;">
        Pagá infracciones, estacioná o contratá abono mensual sin registrarte.
      </p>
    </div>

    <form method="post" action="{% url 'pago_publico_buscar' %}" id="form-buscar-patente">
      {% csrf_token %}

      <!-- Paso 1: ingresar la patente -->
      <div id="paso-ingresar">
        <label for="id_patente" style="font-weight:700; font-size:0.9rem;">Patente del vehículo</label>
        <input type="text" id="id_patente" name="patente" autofocus
               oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase(); alActualizarPatente();"
               placeholder="ABC123 o AA123BB"
               maxlength="10" required autocomplete="off"
               style="font-size:1.8rem; text-align:center; letter-spacing:5px;
                      font-weight:700; text-transform:uppercase; margin-top:0.25rem;">
        <button type="button" id="btn-siguiente"
                onclick="mostrarConfirmacion()"
                class="btn" style="width:100%; margin-top:0.75rem; font-size:1rem; padding:0.8rem;" disabled>
          Buscar →
        </button>
      </div>

      <!-- Paso 2: confirmar la patente antes de enviar -->
      <div id="paso-confirmar" style="display:none; margin-top:1rem; padding:1rem;
           background:#f0fdf4; border:1px solid #c3e6cb; border-radius:10px; text-align:center;">
        <p style="font-size:0.9rem; color:#555; margin-bottom:0.5rem;">¿Es correcta la patente?</p>
        <div id="patente-display"
             style="font-size:2rem; font-weight:800; letter-spacing:6px;
                    color:#14883b; margin-bottom:1rem;"></div>
        <div style="display:flex; gap:0.75rem; justify-content:center;">
          <button type="submit" class="btn"
                  style="font-size:1rem; padding:0.65rem 1.5rem;">
            ✅ Sí, buscar
          </button>
          <button type="button" onclick="corregirPatente()"
                  class="btn btn-outline"
                  style="font-size:1rem; padding:0.65rem 1.5rem;">
            ✏️ Corregir
          </button>
        </div>
      </div>
    </form>

    <script>
    var PATENTE_MINIMA = 5;   // caracteres mínimos para habilitar "Buscar"

    function alActualizarPatente() {
      var p   = document.getElementById("id_patente").value;
      var btn = document.getElementById("btn-siguiente");
      btn.disabled = p.length < PATENTE_MINIMA;
      // Si el usuario edita la patente estando en confirmación, volver al paso 1
      document.getElementById("paso-confirmar").style.display = "none";
      document.getElementById("paso-ingresar").style.display  = "block";
    }

    function mostrarConfirmacion() {
      var p = document.getElementById("id_patente").value;
      if (p.length < PATENTE_MINIMA) return;
      document.getElementById("patente-display").innerText = p;
      document.getElementById("paso-ingresar").style.display  = "none";
      document.getElementById("paso-confirmar").style.display = "block";
    }

    function corregirPatente() {
      document.getElementById("paso-confirmar").style.display = "none";
      document.getElementById("paso-ingresar").style.display  = "block";
      document.getElementById("id_patente").focus();
    }
    </script>

    <div style="margin-top:1.5rem; padding-top:1.5rem; border-top:1px solid var(--color-border);
                text-align:center; font-size:0.85rem; color:var(--color-text-muted);">
      ¿Tenés cuenta? <a href="{% url 'login' %}" style="color:#14883b; font-weight:600;">Ingresar</a>
    </div>
  </div>
</div>
{% endblock %}
