{% extends "base.html" %}
{% block title %}Error del servidor{% endblock %}

{% block content %}
<div class="container" style="display:flex; align-items:center; justify-content:center;
     min-height:calc(100vh - 7rem); padding:2rem 1rem;">
  <div class="card" style="max-width:460px; width:100%; text-align:center; padding:2.5rem 2rem;">
    <div style="font-size:3.5rem; margin-bottom:1rem;">⚙️</div>
    <h1 style="font-size:1.6rem; color:var(--color-primary); margin-bottom:0.5rem;">
      Algo salió mal
    </h1>
    <p style="color:var(--color-text-muted); margin-bottom:1.8rem; line-height:1.5;">
      Ocurrió un error inesperado en el servidor.<br>
      Ya fue registrado. Podés volver e intentarlo de nuevo.
    </p>
    <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
      <a href="javascript:history.back()" class="btn btn-outline">← Volver</a>
      <a href="/" class="btn"
         style="background:var(--color-primary); border-color:var(--color-primary); color:#fff;">
        🏠 Inicio
      </a>
    </div>
    <span style="display:inline-block; margin-top:1.5rem; font-size:0.82rem;
                 color:var(--color-text-muted);">Error 500</span>
  </div>
</div>
{% endblock %}
